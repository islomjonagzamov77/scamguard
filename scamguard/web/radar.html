section.block { margin-top: 56px; }

  };
  var UZ_MONTHS = ["yan", "fev", "mar", "apr", "may", "iyn", "iyl", "avg", "sen", "okt", "noy", "dek"];

  var state = { lang: "uz", data: null };
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  var svgEl = function (tag, attrs) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  var t = function (k) { return (T[state.lang] && T[state.lang][k]) || T.uz[k] || k; };
  var fmt = function (n) { return new Intl.NumberFormat(state.lang === "en" ? "en-US" : "ru-RU").format(n); };
  var parseDay = function (s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); };
  var fmtDay = function (s, long) {
    var d = parseDay(s);
    if (state.lang === "uz") return d.getDate() + "-" + UZ_MONTHS[d.getMonth()] + (long ? " " + d.getFullYear() : "");
    return d.toLocaleDateString(state.lang === "en" ? "en-GB" : "ru-RU", long ? { day: "numeric", month: "short", year: "numeric" } : { day: "numeric", month: "short" });
  };

  /* ---------- language ---------- */
  function pickLang() {
    var q = new URLSearchParams(location.search).get("lang");
    var saved = null;
    try { saved = localStorage.getItem("sg_lang"); } catch (e) {}
    var nav = (navigator.language || "").slice(0, 2);
    return [q, saved, nav].filter(function (x) { return x && T[x]; })[0] || "uz";
  }
  function applyLang() {
    document.documentElement.lang = state.lang;
    document.querySelectorAll("[data-i18n]").forEach(function (n) { n.textContent = t(n.getAttribute("data-i18n")); });
    document.querySelectorAll(".langs button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)); });
    if (state.data) renderAll();
  }
  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.lang = b.dataset.lang;
      try { localStorage.setItem("sg_lang", state.lang); } catch (e) {}
      applyLang();
    });
  });

  /* ---------- tiles ---------- */
  function tile(label, value, sub) {
    var d = el("div", "tile");
    d.appendChild(el("div", "label", label));
    d.appendChild(el("div", "value", value));
    if (sub) d.appendChild(el("div", "sub", sub));
    return d;
  }
  function renderTiles() {
    var box = $("tiles"), tot = state.data.totals;
    box.textContent = "";
    box.hidden = !tot;                 // real totals only, shown once there is enough data
    if (!tot) return;
    box.appendChild(tile(t("t_checks"), fmt(tot.checks), ""));
    box.appendChild(tile(t("t_scams"), fmt(tot.scams), tot.checks ? Math.round(100 * tot.scams / tot.checks) + "%" : ""));
    box.appendChild(tile(t("t_blocked"), fmt(tot.blocked), ""));
  }

  /* ---------- trend chart (one axis, two series, crosshair tooltip) ---------- */
  function niceMax(v) {
    if (v <= 4) return 4;
    var p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  }
  function renderTrend() {
    var box = $("trend"); box.textContent = "";
    // Young service: start the chart at launch (at least 7 days) instead of showing weeks of zeros.
    var all = state.data.daily, first = all.findIndex(function (d) { return d.checks > 0; });
    var start = first > 0 ? Math.max(0, Math.min(first - 1, all.length - 7)) : 0;
    var days = all.slice(start), n = days.length;
    $("trend-h").textContent = start > 0 ? t("trend_h_since") : t("trend_h");
    var W = Math.max(box.clientWidth, 280), H = window.matchMedia("(max-width: 640px)").matches ? 240 : 280;
    var m = { l: 40, r: 44, t: 14, b: 30 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
    var max = niceMax(Math.max.apply(null, days.map(function (d) { return d.checks; }).concat([1])));
    var x = function (i) { return m.l + (n === 1 ? pw / 2 : (i * pw) / (n - 1)); };
    var y = function (v) { return m.t + ph - (v / max) * ph; };
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": t("trend_h") });
    svg.style.height = H + "px";

    // grid + y ticks (hairline, solid)
    for (var k = 0; k <= 4; k++) {
      var v = (max / 4) * k, yy = Math.round(y(v)) + 0.5;
      svg.appendChild(svgEl("line", { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: k === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      var tx = svgEl("text", { x: m.l - 8, y: yy + 4, "text-anchor": "end", class: "axis-text" }); tx.textContent = fmt(v); svg.appendChild(tx);
    }
    // x ticks: as many dates as fit (~1 per 85px), always the first and the last
    var nt = Math.max(2, Math.min(5, Math.floor(pw / 85)));
    for (var k = 0; k < nt; k++) {
      var i = Math.round((k * (n - 1)) / (nt - 1));
      var anchor = k === 0 ? "start" : k === nt - 1 ? "end" : "middle";
      var xt = svgEl("text", { x: x(i), y: H - 8, "text-anchor": anchor, class: "axis-text" });
      xt.textContent = fmtDay(days[i].day); svg.appendChild(xt);
    }
    var path = function (key) { return days.map(function (d, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(d[key]).toFixed(1); }).join(" "); };
    var area = path("checks") + " L" + x(n - 1).toFixed(1) + " " + y(0) + " L" + x(0).toFixed(1) + " " + y(0) + " Z";
    svg.appendChild(svgEl("path", { d: area, fill: "var(--series-1)", "fill-opacity": 0.1 }));
    svg.appendChild(svgEl("path", { d: path("checks"), fill: "none", stroke: "var(--series-1)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    svg.appendChild(svgEl("path", { d: path("scams"), fill: "none", stroke: "var(--series-2)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));

    // end dots + selective end labels (only if they don't collide)
    var last = days[n - 1];
    [["checks", "var(--series-1)"], ["scams", "var(--series-2)"]].forEach(function (s) {
      svg.appendChild(svgEl("circle", { cx: x(n - 1), cy: y(last[s[0]]), r: 4, fill: s[1], stroke: "var(--surface)", "stroke-width": 2 }));
    });
    if (Math.abs(y(last.checks) - y(last.scams)) >= 16) {
      [["checks"], ["scams"]].forEach(function (s) {
        var lt = svgEl("text", { x: x(n - 1) + 10, y: y(last[s[0]]) + 4, class: "end-label" }); lt.textContent = fmt(last[s[0]]); svg.appendChild(lt);
      });
    }

    // crosshair layer
    var cross = svgEl("line", { y1: m.t, y2: m.t + ph, stroke: "var(--axis)", "stroke-width": 1, opacity: 0 });
    var d1 = svgEl("circle", { r: 4, fill: "var(--series-1)", stroke: "var(--surface)", "stroke-width": 2, opacity: 0 });
    var d2 = svgEl("circle", { r: 4, fill: "var(--series-2)", stroke: "var(--surface)", "stroke-width": 2, opacity: 0 });
    svg.appendChild(cross); svg.appendChild(d1); svg.appendChild(d2);
    var hit = svgEl("rect", { x: m.l, y: m.t, width: pw, height: ph, fill: "transparent", tabindex: 0, class: "hit",
      "aria-label": t("trend_h") + ": " + t("table_view") });
    svg.appendChild(hit);
    box.appendChild(svg);

    var tip = el("div", "tip"); tip.setAttribute("aria-hidden", "true"); box.appendChild(tip);
    var cur = n - 1;
    function show(i) {
      cur = Math.max(0, Math.min(n - 1, i));
      var d = days[cur], cx = x(cur);
      cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("opacity", 1);
      d1.setAttribute("cx", cx); d1.setAttribute("cy", y(d.checks)); d1.setAttribute("opacity", 1);
      d2.setAttribute("cx", cx); d2.setAttribute("cy", y(d.scams)); d2.setAttribute("opacity", 1);
      tip.textContent = "";
      tip.appendChild(el("div", "t-date", fmtDay(d.day, true)));
      [["checks", "var(--series-1)", "s_checks"], ["scams", "var(--series-2)", "s_scams"]].forEach(function (s) {
        var row = el("div", "t-row"), key = el("span", "t-key"); key.style.background = s[1];
        row.appendChild(key); row.appendChild(el("b", null, fmt(d[s[0]]))); row.appendChild(el("span", null, t(s[2])));
        tip.appendChild(row);
      });
      var scale = box.clientWidth / W, left = cx * scale + 14;
      if (left + 190 > box.clientWidth) left = cx * scale - 190 - 14;
      tip.style.left = Math.max(0, left) + "px"; tip.style.top = "8px"; tip.classList.add("on");
    }
    function hide() { [cross, d1, d2].forEach(function (e) { e.setAttribute("opacity", 0); }); tip.classList.remove("on"); }
    hit.addEventListener("pointermove", function (e) {
      var r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
      show(Math.round(((px - m.l) / pw) * (n - 1)));
    });
    hit.addEventListener("pointerleave", hide);
    hit.addEventListener("focus", function () { show(cur); });
    hit.addEventListener("blur", hide);
    hit.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { show(cur - 1); e.preventDefault(); }
      if (e.key === "ArrowRight") { show(cur + 1); e.preventDefault(); }
    });

    if (!days.some(function (d) { return d.checks > 0; })) {
      var em = el("div", "empty"); em.appendChild(el("span", null, t("chart_empty"))); box.appendChild(em);
    }

    // table view (always available, no hover needed)
    var tb = $("trend-table"); tb.textContent = "";
    var head = el("tr"); [["th_day", ""], ["s_checks", "n"], ["s_scams", "n"]].forEach(function (h) { head.appendChild(el("th", h[1], t(h[0]))); });
    var thead = el("thead"); thead.appendChild(head); tb.appendChild(thead);
    var tbody = el("tbody");
    days.slice().reverse().forEach(function (d) {
      var r = el("tr"); r.appendChild(el("td", null, fmtDay(d.day, true)));
      r.appendChild(el("td", "n", fmt(d.checks))); r.appendChild(el("td", "n", fmt(d.scams))); tbody.appendChild(r);
    });
    tb.appendChild(tbody);
  }

  /* ---------- categories (single series -> one color) ---------- */
  function renderCats() {
    var box = $("cats"); box.textContent = "";
    var cats = state.data.categories;
    var total = cats.reduce(function (s, c) { return s + c.count; }, 0);
    if (!total) { box.appendChild(el("div", "empty-note", t("cat_empty"))); return; }
    var top = cats[0].count;
    cats.forEach(function (c) {
      var row = el("div", "bar-row"); row.tabIndex = 0;
      var pct = Math.round((100 * c.count) / total);
      row.setAttribute("aria-label", t("c_" + c.id) + ": " + pct + "% (" + fmt(c.count) + ")");
      row.title = fmt(c.count) + " · " + pct + "%";
      var name = el("div", "name"); name.appendChild(el("span", null, t("c_" + c.id)));
      var track = el("div", "bar-track"), fill = el("div", "bar-fill");
      fill.style.width = Math.max(2, (86 * c.count) / top) + "%";
      track.appendChild(fill); track.appendChild(el("span", "bar-val", pct + "%"));
      row.appendChild(name); row.appendChild(track); box.appendChild(row);
    });
  }

  /* ---------- fake sites ---------- */
  var WARN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>';
  function renderSites() {
    var box = $("sites"); box.textContent = "";
    var sites = state.data.sites;
    if (!sites.length) { var li = el("li", "empty-note", t("sites_empty")); box.appendChild(li); return; }
    sites.forEach(function (s) {
      var li = el("li", "site");
      var ico = el("div", "ico"); ico.innerHTML = WARN_ICON; ico.setAttribute("aria-hidden", "true");
      var mid = el("div");
      mid.appendChild(el("div", "dom", s.site));
      var times = s.reporters ? s.reporters : s.hits;
      mid.appendChild(el("div", "meta", t("seen") + ": " + fmtDay(s.last_seen) + " · " + fmt(times) + " " + t("times")));
      li.appendChild(ico); li.appendChild(mid);
      li.appendChild(el("span", "badge", t("src_" + s.source)));
      box.appendChild(li);
    });
  }

  /* ---------- guide ---------- */
  function renderGuide() {
    var box = $("guide"); box.textContent = "";
    (state.data.guide[state.lang] || state.data.guide.uz).forEach(function (g) {
      var c = el("article", "g-card");
      c.appendChild(el("h4", null, g.title));
      c.appendChild(el("p", null, g.how));
      var f = el("div", "flag"); f.appendChild(el("b", null, t("red_flag"))); f.appendChild(document.createTextNode(g.flag));
      c.appendChild(f); box.appendChild(c);
    });
  }

  function renderAll() {
    renderTiles(); renderTrend(); renderCats(); renderSites(); renderGuide();
  }

  /* ---------- data (refetch keeps the frame) ---------- */
  function load() {
    var main = $("main");
    if (state.data) main.classList.add("state-busy");
    fetch("/api/radar.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { state.data = d; $("banner").classList.remove("on"); renderAll(); })
      .catch(function () { var b = $("banner"); b.textContent = t("load_err"); b.classList.add("on"); })
      .finally(function () { main.classList.remove("state-busy"); });
  }

  /* ---------- Telegram Mini App: tell Telegram we're ready and open full height ----------
     (Telegram's documented web-events protocol; no external script needed) */
  function tgPost(type, data) {
    var payload = JSON.stringify({ eventType: type, eventData: data || {} });
    try {
      if (window.TelegramWebviewProxy) window.TelegramWebviewProxy.postEvent(type, JSON.stringify(data || {}));
      else if (window.external && "notify" in window.external) window.external.notify(payload);
      else if (window.parent !== window) window.parent.postMessage(payload, "https://web.telegram.org");
    } catch (e) {}
  }
  tgPost("web_app_ready");
  tgPost("web_app_expand");
  // Inside Telegram the user is already in the bot, so the "check a message" button is not needed.
  var inTelegram = !!window.TelegramWebviewProxy || (window.external && "notify" in window.external) || window.parent !== window;
  if (inTelegram) $("hero-cta").hidden = true;

  state.lang = pickLang();
  applyLang();
  load();
  setInterval(load, 60000);
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { if (state.data) renderTrend(); }, 120); });
})();
